  - id: INST_DPDP_RULES_2025
    authority: AUTH_MEITY
    title: The Digital Personal Data Protection Rules, 2025
    notified_on_claimed: 2025-11-13
    staggered_provisions_claimed:
      - { provision: "Data Protection Board", effective_from: 2025-11-13 }
      - { provision: "Consent Manager obligations", effective_from_relative: "+12 months" }
      - { provision: "Core data fiduciary obligations (notice, breach reporting)", effective_from_relative: "+18 months" }
    url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/nov/doc20251117695301.pdf
    retrieved_on: 2026-08-24
    verification_status: SECONDARY_ONLY
    in_scope_for_us: true
    obligation_kind: platform_must_satisfy
    priority: HIGH
    notes: >-
      Dates are from secondary legal commentary; the PIB document retrieved did not
      confirm them. CONFIRM AGAINST THE GAZETTE IN B1. If +18 months holds, core
      obligations bite around 2027-05-13 - inside our likely production timeline, so
      treat as a design constraint now.

# ---------------------------------------------------------------------------------
# External verification source candidates, with preliminary access tiers (ADR-0005).
# tier: T1 official API | T2 licensed intermediary | T3 portal, terms permit automation
#       T4 portal, human-operated | T5 offline/physical | T6 unavailable
# ---------------------------------------------------------------------------------
verification_sources:

  - id: SRC_CERSAI
    authority: AUTH_CERSAI
    tier_preliminary: T1_OR_T2
    tier_confidence: LOW
    priority: 1
    verifies: [existing_charges, encumbrance, multiple_lending_against_same_collateral]
    keyed_by: [property_identifiers, borrower_identifiers]
    access_note: >-
      Institutional entity accounts, not anonymous public lookup. Our lender is an NBFC/HFC
      and plausibly already holds a CERSAI account - ASK THE BUSINESS rather than researching
      from outside. Best automated-adapter candidate in the map.
    open_questions:
      - What programmatic access exists for a registered entity, under what agreement?
      - Rate limits and permitted use for underwriting-time checks?

  - id: SRC_IGR_ESEARCH
    authority: AUTH_IGR_MH
    tier_preliminary: T4
    tier_confidence: LOW
    priority: 2
    verifies: [registration_particulars, index_ii, parties, consideration, property_description]
    keyed_by: [document_number, year, sro, cts_number]
    access_note: >-
      Free eSearch reported as CAPTCHA-gated, no login. CAPTCHA implies human-operated by
      our own rule. Highest-value source for deed authenticity - Index II independently
      attests parties, property, consideration and registration particulars.
    blocked_on: [read_terms_of_use_from_indian_network]

  - id: SRC_MAHARERA
    authority: AUTH_MAHARERA
    tier_preliminary: T4
    tier_confidence: VERY_LOW
    priority: 3
    verifies: [project_name, promoter, registration_number, project_status, phase, registration_validity]
    keyed_by: [maharera_registration_number, project_name, promoter_name, promoter_pan, district]
    applicability_gate: >-
      Only applicable to projects meeting the RERA registration threshold. Older resale
      flats and independent properties are NOT_APPLICABLE, not NOT_FOUND_IN_SOURCE.
    blocked_on: [read_terms_of_use_from_indian_network, confirm_rera_threshold]

  - id: SRC_MCGM_PTAX
    authority: AUTH_MCGM
    tier_preliminary: T4
    tier_confidence: LOW
    priority: 4
    verifies: [assessee_name, property_address, assessment_number, outstanding_dues, payment_history]
    keyed_by: [property_account_number_pid, assessment_number, ward_name_address]
    access_note: CAPTCHA on entry. Outstanding dues are a material collateral risk indicator.

  - id: SRC_PROPERTY_CARD_MH
    authority: AUTH_LANDRECORDS_MH
    tier_preliminary: T4_OR_T5
    tier_confidence: VERY_LOW
    priority: 5
    verifies: [owner_of_record, cts_number, area, boundaries, encumbrance_notes]
    keyed_by: [cts_number, city_survey_office]
    access_note: >-
      Mumbai urban record is the Property Card (PR Card / Malmatta Patrak) keyed by CTS
      number - NOT the rural 7/12 extract. Mumbai Suburban District reported to have ten
      City Survey Offices. Some access reported to be email/application based (T5).
    architectural_impact: >-
      Canonical model must use a TYPED parcel identifier (cts_number | survey_number |
      gat_number | hissa_number), not a single survey_number string.
