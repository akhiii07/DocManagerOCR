# B0 deliverable — machine-readable regulatory source register.
#
# This is the seed of the Regulatory Knowledge Base. It records WHERE authoritative text
# lives and HOW confident we are that we have read it. It does NOT contain requirements or
# rules — those are produced in B1 and must cite an entry here by `id`.
#
# verification_status:
#   PRIMARY_VERIFIED  retrieved and read from the authority's own site
#   PRIMARY_LOCATED   official source identified, substantive text not yet read
#   SECONDARY_ONLY    only secondary sources consulted — MUST NOT ground a rule
#   UNREACHABLE       official source identified but could not be retrieved
#
# INVARIANT: a rule may only cite a source whose verification_status is PRIMARY_VERIFIED.

schema_version: 1
compiled_at: 2026-08-24
scope:
  lender_type: [NBFC, HFC]
  products: [home_loan, loan_against_property]
  jurisdiction:
    country: IN
    state: MH
    city: Mumbai

authorities:

  - id: AUTH_RBI
    name: Reserve Bank of India
    kind: financial_regulator
    site: https://www.rbi.org.in/
    governs: [prudential_regulation, conduct, digital_lending, outsourcing, kyc]

  - id: AUTH_PARLIAMENT
    name: Parliament of India / India Code
    kind: legislature
    site: https://www.indiacode.nic.in/
    governs: [property_transfer, registration, security_interest, real_estate_regulation]

  - id: AUTH_MAHARERA
    name: Maharashtra Real Estate Regulatory Authority
    kind: sectoral_regulator
    site: https://maharera.maharashtra.gov.in/
    governs: [real_estate_project_registration, promoter_registration]

  - id: AUTH_IGR_MH
    name: Department of Registration & Stamps, Maharashtra (IGR)
    kind: state_registration_authority
    site: https://igrmaharashtra.gov.in/
    governs: [document_registration, stamp_duty, index_ii, valuation]

  - id: AUTH_LANDRECORDS_MH
    name: Maharashtra Land Records Department (Bhumi Abhilekh) / City Survey Office
    kind: state_land_records_authority
    site: https://bhumiabhilekh.maharashtra.gov.in/
    governs: [property_card, cts_records, urban_land_records]

  - id: AUTH_MCGM
    name: Municipal Corporation of Greater Mumbai
    kind: municipal_authority
    site: https://ptaxportal.mcgm.gov.in/CitizenPortal/
    governs: [property_tax_assessment, municipal_dues]

  - id: AUTH_CERSAI
    name: Central Registry of Securitisation Asset Reconstruction and Security Interest of India
    kind: central_registry
    site: https://www.cersai.org.in/CERSAI/JSP/index.jsp
    governs: [security_interest_registration, encumbrance_central_record]
    statutory_basis: INST_SARFAESI_2002

  - id: AUTH_MEITY
    name: Ministry of Electronics and Information Technology
    kind: data_protection_authority
    site: https://www.meity.gov.in/
    governs: [personal_data_protection]

instruments:

  - id: INST_RBI_RELEASE_DOCS_2023
    authority: AUTH_RBI
    title: >-
      Responsible Lending Conduct - Release of Movable / Immovable Property Documents
      on Repayment/ Settlement of Personal Loans
    reference: RBI/2023-24/60
    circular_no: DoR.MCS.REC.38/01.01.001/2023-24
    issued_on: 2023-09-13
    effective_from: 2023-12-01
    superseded_by: null
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12535&Mode=0
    retrieved_on: 2026-08-24
    verification_status: PRIMARY_VERIFIED
    applies_to: [commercial_banks, local_area_banks, ucbs, stcbs, dccbs, nbfcs, hfcs, arcs]
    in_scope_for_us: true
    obligation_kind: platform_tracks     # post-closure obligation, not an origination gate
    notes: >-
      30-day release of original documents and charge removal after full repayment;
      compensation of INR 5,000 per day of delay; duplicate-document assistance with an
      additional 30-day grace period. Implies the platform must maintain a per-case
      document custody inventory.

  - id: INST_RBI_DIGITAL_LENDING_2025
    authority: AUTH_RBI
    title: Reserve Bank of India (Digital Lending) Directions, 2025
    reference: RBI/2025-26/36
    circular_no: DOR.STR.REC.19/21.07.001/2025-26
    issued_on: 2025-05-08
    effective_from: 2025-05-08
    staggered_provisions:
      - { provision: "Para 6", effective_from: 2025-11-01 }
      - { provision: "Para 17", effective_from: 2025-06-15 }
    url: https://rbi.org.in/Scripts/NotificationUser.aspx?Id=12848&Mode=0
    retrieved_on: 2026-08-24
    verification_status: PRIMARY_VERIFIED
    applies_to: [commercial_banks, cooperative_banks, nbfcs, hfcs, aifis]
    in_scope_for_us: true
    obligation_kind: platform_must_satisfy
    notes: >-
      Chapters: Preliminary; RE-LSP Arrangements; Conduct and Customer Protection;
      Technology and Data Requirement; Reporting of Credit Information and DLAs;
      Loss Sharing; General and Repeal. Data-localisation and consent provisions bind
      OUR architecture. B1 must read Chapter 4 in full.

  - id: INST_RBI_HFC_MD_2021
    authority: AUTH_RBI
    title: >-
      Master Direction - Non-Banking Financial Company - Housing Finance Company
      (Reserve Bank) Directions, 2021
    reference: RBI/2020-21/73
    circular_no: DOR.FIN.HFC.CC.No.120/03.10.136/2020-21
    issued_on: 2021-02-17
    last_updated_on: 2025-07-17
    url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12030
    local_copy: docs/regulatory/sources/rbi-hfc-md-2021.pdf
    retrieved_on: 2026-08-24
    verification_status: PRIMARY_VERIFIED
    applies_to: [hfcs]
    in_scope_for_us: true
    obligation_kind: platform_checks
    priority: HIGH
    pages: 230
    header_confirms: >-
      RBI/2020-21/73 DOR.FIN.HFC.CC.No.120/03.10.136/2020-21, February 17, 2021,
      "(Updated as on July 17, 2025*)" - matches the index-page metadata recorded in B0.
    notes: >-
      B1 EXTRACTION DONE for LTV, valuation and disbursement. See requirements.yaml:
      Para 19 (LTV caps and computation), Para 104 + Annex XIV (valuation policy,
      valuer independence, two-valuation thresholds, and Annex XIV 1.9 which caps the
      LTV property value at the documented transaction value in the agreement to sale /
      sale deed). Negative finding recorded: NO title-verification duty in this
      instrument.

  - id: INST_RBI_OUTSOURCING_IT_2023
    authority: AUTH_RBI
    title: Master Direction on Outsourcing of Information Technology Services
    reference: RBI/2023-24/102
    circular_no: DoS.CO.CSITEG/SEC.1/31.01.015/2023-24
    issued_on: 2023-04-10
    url: https://www.rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=12486
    local_copy: docs/regulatory/sources/rbi-outsourcing-it-md-2023.pdf
    retrieved_on: 2026-08-24
    verification_status: PRIMARY_VERIFIED   # identity/metadata verified from the PDF header
    extraction_status: PENDING              # substantive requirements not yet extracted
    pages: 31
    applies_to: [scheduled_commercial_banks_excl_rrbs, local_area_banks, small_finance_banks,
                 payments_banks, ucbs, nbfcs, cics, aifis]
    hfc_applicability: UNCONFIRMED
    in_scope_for_us: true
    obligation_kind: platform_must_satisfy
    notes: >-
      Addressee list confirmed verbatim from PDF p1. It names "Non-Banking Financial
      Companies" but does NOT say "including Housing Finance Companies" - unlike
      INST_RBI_RELEASE_DOCS_2023 and INST_RBI_DIGITAL_LENDING_2025, which both spell out
      "including HFCs". That difference in drafting is exactly why HFC applicability must
      be confirmed rather than inferred. Directly relevant: this platform IS an IT service,
      so if it is hosted or operated by a third party these directions likely govern the
      arrangement.

  - id: INST_REGISTRATION_ACT_1908
    authority: AUTH_PARLIAMENT
    title: The Registration Act, 1908
    key_sections: ["17"]
    url: https://www.indiacode.nic.in/bitstream/123456789/15937/1/the_registration_act,1908.pdf
    section_url: https://www.indiacode.nic.in/show-data?actid=AC_CEN_18_43_00004_190816_1523340837338&orderno=18
    retrieved_on: 2026-08-24
    verification_status: PRIMARY_LOCATED
    in_scope_for_us: true
    obligation_kind: platform_checks
    priority: HIGH
    notes: >-
      s.17 determines which instruments MUST be registered. Basis for a deterministic
      document-defect check: an instrument requiring registration that shows no
      registration particulars is a defect.

  - id: INST_TPA_1882
    authority: AUTH_PARLIAMENT
    title: The Transfer of Property Act, 1882
    url: null
    verification_status: PRIMARY_LOCATED
    in_scope_for_us: true
    obligation_kind: platform_checks
    notes: Governs valid sale, mortgage and charge. Locate official text in B1.

  - id: INST_MH_STAMP_ACT_1958
    authority: AUTH_PARLIAMENT
    title: The Maharashtra Stamp Act, 1958
    text_as_on: 2025-04-08
    url: https://www.indiacode.nic.in/bitstream/123456789/22026/1/the_maharashtra_stamp_act,_1958.pdf
    retrieved_on: 2026-08-24
    verification_status: PRIMARY_LOCATED
    in_scope_for_us: true
    obligation_kind: platform_checks
    notes: Stamp duty adequacy; under-stamping affects admissibility of the instrument.

  - id: INST_SARFAESI_2002
    authority: AUTH_PARLIAMENT
    title: >-
      Securitisation and Reconstruction of Financial Assets and Enforcement of
      Security Interest Act, 2002
    key_chapters: ["IV"]
    verification_status: PRIMARY_LOCATED
    in_scope_for_us: true
    obligation_kind: platform_checks
    notes: Chapter IV is the statutory basis for CERSAI registration of security interests.

  - id: INST_RERA_2016
    authority: AUTH_PARLIAMENT
    title: The Real Estate (Regulation and Development) Act, 2016
    verification_status: PRIMARY_LOCATED
    in_scope_for_us: true
    obligation_kind: platform_checks
    notes: >-
      B1 must establish the registration threshold precisely. Secondary sources report
      >500 sq m land area or >8 apartments. This threshold decides NOT_APPLICABLE vs
      NOT_FOUND_IN_SOURCE for MahaRERA checks and is therefore false-positive critical.

  - id: INST_MLRC_1966
    authority: AUTH_PARLIAMENT
    title: The Maharashtra Land Revenue Code, 1966
    key_sections_claimed: ["282"]
    verification_status: SECONDARY_ONLY
    in_scope_for_us: true
    obligation_kind: platform_checks
    notes: >-
      Reported basis for the urban Property Card. Section number from secondary sources
      only - CONFIRM before citing.

  - id: INST_DPDP_ACT_2023
    authority: AUTH_MEITY
    title: The Digital Personal Data Protection Act, 2023
    verification_status: PRIMARY_LOCATED
    in_scope_for_us: true
    obligation_kind: platform_must_satisfy
    priority: HIGH

  - id: INST_DPDP_RULES_2025
    authority: AUTH_MEITY
    title: The Digital Personal Data Protection Rules, 2025
    notified_on_claimed: 2025-11-13
    staggered_provisions_claimed:
      - { provision: "Data Protection Board", effective_from: 2025-11-13 }
      - { provision: "Consent Manager obligations", effective_from_relative: "+12 months" }
      - { provision: "Core data fiduciary obligations (notice, breach reporting)", effective_from_relative: "+18 months" }
    url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/nov/doc20251117695301.pdf
    retrieved_on: 2026-08-24
    verification_status: SECONDARY_ONLY
    in_scope_for_us: true
    obligation_kind: platform_must_satisfy
    priority: HIGH
    notes: >-
      Dates are from secondary legal commentary; the PIB document retrieved did not
      confirm them. CONFIRM AGAINST THE GAZETTE IN B1. If +18 months holds, core
      obligations bite around 2027-05-13 - inside our likely production timeline, so
      treat as a design constraint now.

# ---------------------------------------------------------------------------------
# External verification source candidates, with preliminary access tiers (ADR-0005).
# tier: T1 official API | T2 licensed intermediary | T3 portal, terms permit automation
#       T4 portal, human-operated | T5 offline/physical | T6 unavailable
# ---------------------------------------------------------------------------------
verification_sources:

  - id: SRC_CERSAI
    authority: AUTH_CERSAI
    tier_preliminary: T1_OR_T2
    tier_confidence: LOW
    priority: 1
    verifies: [existing_charges, encumbrance, multiple_lending_against_same_collateral]
    keyed_by: [property_identifiers, borrower_identifiers]
    access_note: >-
      Institutional entity accounts, not anonymous public lookup. Our lender is an NBFC/HFC
      and plausibly already holds a CERSAI account - ASK THE BUSINESS rather than researching
      from outside. Best automated-adapter candidate in the map.
    open_questions:
      - What programmatic access exists for a registered entity, under what agreement?
      - Rate limits and permitted use for underwriting-time checks?

  - id: SRC_IGR_ESEARCH
    authority: AUTH_IGR_MH
    tier_preliminary: T4
    tier_confidence: LOW
    priority: 2
    verifies: [registration_particulars, index_ii, parties, consideration, property_description]
    keyed_by: [document_number, year, sro, cts_number]
    access_note: >-
      Free eSearch reported as CAPTCHA-gated, no login. CAPTCHA implies human-operated by
      our own rule. Highest-value source for deed authenticity - Index II independently
      attests parties, property, consideration and registration particulars.
    blocked_on: [read_terms_of_use_from_indian_network]

  - id: SRC_MAHARERA
    authority: AUTH_MAHARERA
    tier_preliminary: T4
    tier_confidence: VERY_LOW
    priority: 3
    verifies: [project_name, promoter, registration_number, project_status, phase, registration_validity]
    keyed_by: [maharera_registration_number, project_name, promoter_name, promoter_pan, district]
    applicability_gate: >-
      Only applicable to projects meeting the RERA registration threshold. Older resale
      flats and independent properties are NOT_APPLICABLE, not NOT_FOUND_IN_SOURCE.
    blocked_on: [read_terms_of_use_from_indian_network, confirm_rera_threshold]

  - id: SRC_MCGM_PTAX
    authority: AUTH_MCGM
    tier_preliminary: T4
    tier_confidence: LOW
    priority: 4
    verifies: [assessee_name, property_address, assessment_number, outstanding_dues, payment_history]
    keyed_by: [property_account_number_pid, assessment_number, ward_name_address]
    access_note: CAPTCHA on entry. Outstanding dues are a material collateral risk indicator.

  - id: SRC_PROPERTY_CARD_MH
    authority: AUTH_LANDRECORDS_MH
    tier_preliminary: T4_OR_T5
    tier_confidence: VERY_LOW
    priority: 5
    verifies: [owner_of_record, cts_number, area, boundaries, encumbrance_notes]
    keyed_by: [cts_number, city_survey_office]
    access_note: >-
      Mumbai urban record is the Property Card (PR Card / Malmatta Patrak) keyed by CTS
      number - NOT the rural 7/12 extract. Mumbai Suburban District reported to have ten
      City Survey Offices. Some access reported to be email/application based (T5).
    architectural_impact: >-
      Canonical model must use a TYPED parcel identifier (cts_number | survey_number |
      gat_number | hissa_number), not a single survey_number string.

# ---------------------------------------------------------------------------------
# PROVENANCE OF LOCAL COPIES
#
# A PDF sitting in sources/ is not automatically authoritative. Provenance is graded
# per file, because a stale or aggregator-sourced copy will silently produce wrong
# rules. Two of the uploaded files self-declare that they could not be verified.
# ---------------------------------------------------------------------------------
local_copy_provenance:

  - file: rbi-hfc-md-2021.pdf
    grade: AUTHORITATIVE
    reason: Official RBI letterhead, matching reference number and update history.

  - file: rbi-outsourcing-it-md-2023.pdf
    grade: AUTHORITATIVE
    reason: Official RBI letterhead with reference number and addressee list.

  - file: transfer-of-property-act-1882.pdf
    grade: LIKELY_AUTHORITATIVE
    reason: Official "ARRANGEMENT OF SECTIONS" bare-act format consistent with India Code.

  - file: sarfaesi-act-2002.pdf
    grade: LIKELY_AUTHORITATIVE
    reason: Same official bare-act format.

  - file: rera-act-2016.pdf
    grade: LIKELY_AUTHORITATIVE
    reason: Same official bare-act format.

  - file: registration-act-1908-s17.pdf
    grade: EXTRACT_ONLY
    reason: >-
      Contains Section 17 alone, not the full Act, and is formatted as a third-party
      section extract rather than the official bare Act. Sufficient to READ s.17;
      insufficient to confirm that s.17 has not been amended, or to check
      cross-referenced sections (s.18, s.49 on the effect of non-registration).
    action: Obtain the full Act from India Code before authoring a registration rule.

  - file: maharashtra-stamp-act-1958.pdf
    grade: STALE_UNVERIFIED
    reason: >-
      Third-party aggregator copy. Page 1 states "Last Updated 4th November, 2019" and
      carries the disclaimer "[Note: The original publication document is not available
      and this content could not be verified.]" B0 located an India Code version marked
      "text as on 8th April 2025" - this copy is roughly six years behind it.
    action: >-
      DO NOT ground any stamp-duty rule on this file. Stamp duty rates and articles are
      exactly the provisions most likely to have changed since 2019. Replace with the
      India Code version.

  - file: mh-city-survey-rules-1969.pdf
    grade: STALE_UNVERIFIED
    reason: >-
      Same aggregator and same "could not be verified" disclaimer. Also note this is the
      City Survey RULES, whereas B0 recorded the Property Card as resting on the
      Maharashtra Land Revenue CODE s.282 - a different instrument.
    action: >-
      Useful background on the City Survey/Property Card mechanism, but the Code itself
      is still required to confirm the s.282 claim.

  - file: dpdp-rules-2025-pib.pdf
    grade: GOVERNMENT_SECONDARY
    reason: >-
      A PIB explanatory press release, not the Gazette notification. Authoritative as to
      the government's own account, but it is not the operative legal text.
    finding: >-
      DATE CONFLICT. This PIB document states the DPDP Rules were notified on
      "14 November 2025". The B0 authority map recorded 13 November 2025 from secondary
      legal commentary. PIB is the better source of the two, so 14 November is now the
      working date - but neither is the Gazette.
    action: Obtain the Gazette notification to settle the date and the commencement schedule.
