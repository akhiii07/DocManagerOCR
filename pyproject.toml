[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmocr"
version = "0.1.0"
description = "Collateral document intelligence, compliance verification and risk assessment"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
tools = [
    "pypdfium2>=4.30",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
]
# OCR. RapidOCR is an ONNX packaging of the PP-OCR models. See ADR-0013:
# paddlepaddle publishes no wheels for Python 3.14, and rapidocr-onnxruntime bundles
# its models in the wheel rather than downloading them at runtime, which matters under
# the no-egress privacy constraint.
ocr = [
    "rapidocr-onnxruntime>=1.2",
]
# Review UI. No build step, no npm, no CDN - a no-egress deployment cannot fetch a
# frontend framework at runtime.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dmocr.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: exercises a real OCR engine; skipped automatically if none is installed",
]
