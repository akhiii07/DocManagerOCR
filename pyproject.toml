[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmocr"
version = "0.1.0"
description = "Collateral document intelligence, compliance verification and risk assessment"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
tools = [
    "pypdfium2>=4.30",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
